name: build & release

# Compile le firmware Cardputer avec PlatformIO.
#  - Sur push/PR : build de vérification (sanity).
#  - Sur tag `v*` : build puis création d'une release GitHub avec le firmware.bin
#    mono-fichier (flash @ 0x0) attaché, prêt à installer sur le Cardputer.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e cardputer-adv

      - name: Rename firmware artifact
        run: cp firmware.bin "cardputer-dwight-${GITHUB_REF_NAME}.bin"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware.bin

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware.bin
            cardputer-dwight-${{ github.ref_name }}.bin
          generate_release_notes: true
          body: |
            ## Installation sur le M5Cardputer

            Téléchargez `firmware.bin` ci-dessous (image mono-fichier, à flasher à l'offset `0x0`).

            ```bash
            esptool.py --chip esp32s3 --port /dev/cu.usbmodem* write_flash 0x0 firmware.bin
            ```

            Ou via l'interface web ESP : https://web.esphome.io / https://espressif.github.io/esptool-js/
